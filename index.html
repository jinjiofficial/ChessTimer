<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>D-Day Wallpaper v2</title>
    <!-- 아미 느낌의 한글/영문 폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Black Han Sans (한글 스텐실 느낌), Black Ops One (영문 스텐실) -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Black+Ops+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ff0000;
            /* 1080x2340 해상도 비율 맞춤 */
            width: 1080px;
            height: 2340px;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* 배경화면 캡처용 고정 크기 */
            aspect-ratio: 1080 / 2340;
            margin: 0 auto;
            /* 기본 한글 폰트 설정 */
            font-family: 'Black Han Sans', sans-serif;
        }

        .container {
            text-align: center;
        }

        .title {
            /* 한글 폰트 적용 및 크기 축소 */
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.8rem; /* 더 작게 조정 */
            font-weight: normal; /* Black Han Sans는 기본적으로 굵음 */
            letter-spacing: 2px;
            margin-bottom: 5px; /* 간격 축소 */
            color: #ff0000;
            opacity: 0.8; /* 약간 더 흐리게 */
            /* 약간의 네온 빛 느낌 추가 */
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.7);
        }

        .dday {
            /* 영문/숫자 스텐실 폰트 적용 */
            font-family: 'Black Ops One', sans-serif;
            font-size: 9rem; /* 크기 약간 확대 */
            line-height: 1;
            letter-spacing: 5px;
            /* 약간의 네온 빛 느낌 추가 */
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">시험까지</div>
        <div class="dday" id="dday-text">D-DAY</div>
    </div>

    <script>
        function calculateDDay() {
            // 시험 날짜 설정 (2026년 9월 19일)
            const targetDate = new Date('2026-09-19T00:00:00');
            // 현재 로컬 날짜 가져오기
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            // 두 날짜의 차이 계산 (밀리초 단위)
            const diff = targetDate - today;
            // 일 단위로 변환
            const diffDays = Math.ceil(diff / (1000 * 60 * 60 * 24));
            
            const ddayTextElement = document.getElementById('dday-text');
            
            if (diffDays > 0) {
                ddayTextElement.innerText = `D-${diffDays}`;
            } else if (diffDays === 0) {
                ddayTextElement.innerText = 'D-DAY';
            } else {
                ddayTextElement.innerText = `D+${Math.abs(diffDays)}`;
            }
        }

        // 실행
        calculateDDay();
    </script>
</body>
</html>
