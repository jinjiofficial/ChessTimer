<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio J - 로컬 센서 Cam</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.5s ease;
            cursor: pointer; /* 터치할 수 있음을 표시 */
        }
        #welcome-message {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0,255,204,0.6);
        }
        #video, #canvas {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            width: 160px;
            height: 120px;
        }
        /* 상단에 전체화면 안내 문구 잠시 띄우기 */
        #fs-guide {
            position: absolute;
            top: 20px;
            font-size: 14px;
            color: #555;
            transition: opacity 1s;
        }
    </style>
</head>
<body onclick="openFullscreen();">

    <div id="fs-guide">화면을 아무 곳이나 터치하면 전체화면이 됩니다.</div>
    <div id="welcome-message">Studio J에 오신 것을 환영합니다!</div>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "studio-j-cam.firebaseapp.com",
            databaseURL: "https://studio-j-cam-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "studio-j-cam",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const welcomeMessage = document.getElementById('welcome-message');

        let lastFrameData = null;
        let isDetected = false;

        // 🌟 강제 전체화면 기능 함수
        function openFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* 사파리/크롬 구버전 */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE */
                elem.msRequestFullscreen();
            }
            // 전체화면이 되면 안내 문구 숨기기
            document.getElementById('fs-guide').style.opacity = '0';
        }

        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
            .then(stream => {
                video.srcObject = stream;
                setInterval(detectMotion, 300);
            })
            .catch(err => alert("카메라 권한이 필요합니다: " + err));

        function detectMotion() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            canvas.width = 160;
            canvas.height = 120;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            if (lastFrameData) {
                let changedPixels = 0;
                for (let i = 0; i < frameData.length; i += 4) {
                    const rDiff = Math.abs(frameData[i] - lastFrameData[i]);
                    const gDiff = Math.abs(frameData[i+1] - lastFrameData[i+1]);
                    const bDiff = Math.abs(frameData[i+2] - lastFrameData[i+2]);
                    
                    if (rDiff + gDiff + bDiff > 60) { 
                        changedPixels++;
                    }
                }

                if (changedPixels > (canvas.width * canvas.height) * 0.08 && !isDetected) {
                    triggerWelcome();
                }
            }
            lastFrameData = frameData;
        }

        function triggerWelcome() {
            isDetected = true;
            console.log("로컬 움직임 감지됨!");

            document.body.style.backgroundColor = "#121212";
            welcomeMessage.style.opacity = "1";
            welcomeMessage.style.transform = "scale(1)";

            const now = new Date();
            const timeString = now.toLocaleTimeString();
            
            database.ref('last_detect').set(timeString);
            database.ref('logs').push({
                event: "움직임 감지 (침입 발생 가능)",
                time: now.toLocaleString()
            });

            setTimeout(() => {
                document.body.style.backgroundColor = "#000000";
                welcomeMessage.style.opacity = "0";
                welcomeMessage.style.transform = "scale(0.8)";
                isDetected = false;
            }, 3500);
        }
    </script>
</body>
</html>
