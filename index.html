<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio J - 로컬 센서 Cam</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.5s ease;
        }
        #welcome-message {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0,255,204,0.6);
        }
        /* 감지용 숨김 비디오 및 캔버스 */
        #video, #canvas {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            width: 160px;
            height: 120px;
        }
    </style>
</head>
<body>

    <div id="welcome-message">Studio J에 오신 것을 환영합니다!</div>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // 🔴 중요: 네 파이어베이스 프로젝트 구성 정보로 변경해줘!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "studio-j-cam.firebaseapp.com",
            databaseURL: "https://studio-j-cam-default-rtdb.firebaseio.com",
            projectId: "studio-j-cam",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const welcomeMessage = document.getElementById('welcome-message');

        let lastFrameData = null;
        let isDetected = false;

        // 720p 화질 요청하되, 로컬 감지 연산 속도를 위해 캔버스는 작게 씀
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
            .then(stream => {
                video.srcObject = stream;
                setInterval(detectMotion, 300); // 0.3초마다 움직임 체크
            })
            .catch(err => alert("카메라 권한이 필요합니다: " + err));

        function detectMotion() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            // 캔버스 크기를 감지용 세팅으로 맞춤
            canvas.width = 160;
            canvas.height = 120;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            if (lastFrameData) {
                let changedPixels = 0;
                // 픽셀 변화량 계산
                for (let i = 0; i < frameData.length; i += 4) {
                    const rDiff = Math.abs(frameData[i] - lastFrameData[i]);
                    const gDiff = Math.abs(frameData[i+1] - lastFrameData[i+1]);
                    const bDiff = Math.abs(frameData[i+2] - lastFrameData[i+2]);
                    
                    if (rDiff + gDiff + bDiff > 60) { // 픽셀 색상 차이 기준치
                        changedPixels++;
                    }
                }

                // 전체 픽셀 중 일정 비율 이상 변하면 움직임으로 인식
                if (changedPixels > (canvas.width * canvas.height) * 0.08 && !isDetected) {
                    triggerWelcome();
                }
            }
            lastFrameData = frameData;
        }

        function triggerWelcome() {
            isDetected = true;
            console.log("로컬 움직임 감지됨!");

            // 1. 화면 켜고 환영 문구 띄우기
            document.body.style.backgroundColor = "#121212";
            welcomeMessage.style.opacity = "1";
            welcomeMessage.style.transform = "scale(1)";

            // 2. 파이어베이스에 단순 텍스트 로그 및 시간만 쏘기 (영상 X)
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            
            database.ref('last_detect').set(timeString);
            // 로그 리스트에도 누적 기록 추가
            database.ref('logs').push({
                event: "움직임 감지 (침입 발생 가능)",
                time: now.toLocaleString()
            });

            // 3초 후 다시 화면 어둡게 대기 상태로 전환
            setTimeout(() => {
                document.body.style.backgroundColor = "#000000";
                welcomeMessage.style.opacity = "0";
                welcomeMessage.style.transform = "scale(0.8)";
                isDetected = false;
            }, 3500);
        }
    </script>
</body>
</html>
